<style>
  :root { --cream: #FAF7F2; --dark: #1C1610; }
  body { background: var(--cream); font-family: sans-serif; margin: 0; }
  .showcase-section { padding: 80px 24px; }
  .grid-hero { max-width: 1280px; margin: 0 auto; display: grid; gap: 5px; }
  
  /* Grid settings based on your specific counts */
  .grid-reception { grid-template-columns: repeat(5, 1fr); }
  .grid-ceremony { grid-template-columns: repeat(4, 1fr); }
  .grid-bouquet { grid-template-columns: repeat(3, 1fr); }
  .grid-debut { grid-template-columns: repeat(4, 1fr); }
  .grid-birthday { grid-template-columns: repeat(4, 1fr); }
  
  .grid-hero { grid-auto-rows: 240px; }
  .img-card { height: 100%; background: #ccc; }
  .img-placeholder { width: 100%; height: 100%; background-size: cover; background-position: center; }
