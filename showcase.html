<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Showcase — Erish Studio Events & Styling</title>
<!-- [Header and CSS remains exactly as you had it] -->
<style>
/* Keeping your existing styles intact */
.grid-reception { grid-template-columns: repeat(5, 1fr); }
.grid-ceremony { grid-template-columns: repeat(4, 1fr); }
.grid-bouquet { grid-template-columns: repeat(3, 1fr); }
.grid-debut { grid-template-columns: repeat(4, 1fr); }
.grid-birthday { grid-template-columns: repeat(4, 1fr); }
</style>
</head>
<body>

<!-- RECEPTION (10 images) -->
<section class="showcase-section" id="reception">
  <div class="grid-hero grid-reception reveal">
    <!-- Loop for 1 to 10 -->
    <script>for(let i=1; i<=10; i++) document.write(`<div class="img-card"><div class="img-placeholder reception-${i}"></div><div class="card-overlay"><div class="card-overlay-title">Reception ${i}</div><div class="card-overlay-sub">Erish Studio</div></div></div>`);</script>
  </div>
</section>

<!-- CEREMONY (8 images) -->
<section class="showcase-section" id="ceremony">
  <div class="grid-hero grid-ceremony reveal">
    <script>for(let i=1; i<=8; i++) document.write(`<div class="img-card"><div class="img-placeholder ceremony-${i}"></div><div class="card-overlay"><div class="card-overlay-title">Ceremony ${i}</div><div class="card-overlay-sub">Erish Studio</div></div></div>`);</script>
  </div>
</section>

<!-- BOUQUET (9 images) -->
<section class="showcase-section" id="bouquet">
  <div class="grid-hero grid-bouquet reveal">
    <script>for(let i=1; i<=9; i++) document.write(`<div class="img-card"><div class="img-placeholder bouquet-${i}"></div><div class="card-overlay"><div class="card-overlay-title">Bouquet ${i}</div><div class="card-overlay-sub">Erish Studio</div></div></div>`);</script>
  </div>
</section>

<!-- DEBUT (7 images) -->
<section class="showcase-section" id="debut">
  <div class="grid-hero grid-debut reveal">
    <script>for(let i=1; i<=7; i++) document.write(`<div class="img-card"><div class="img-placeholder debut-${i}"></div><div class="card-overlay"><div class="card-overlay-title">Debut ${i}</div><div class="card-overlay-sub">Erish Studio</div></div></div>`);</script>
  </div>
</section>

<!-- BIRTHDAY (7 images) -->
<section class="showcase-section" id="birthday">
  <div class="grid-hero grid-birthday reveal">
    <script>for(let i=1; i<=7; i++) document.write(`<div class="img-card"><div class="img-placeholder bday-${i}"></div><div class="card-overlay"><div class="card-overlay-title">Birthday ${i}</div><div class="card-overlay-sub">Erish Studio</div></div></div>`);</script>
  </div>
</section>

</body>
</html>
