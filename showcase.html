<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Showcase — Erish Studio Events & Styling</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500;1,600&family=Jost:wght@200;300;400;500;600&display=swap" rel="stylesheet"/>
<style>
/* CSS styles remain identical to your previous version to keep functionality intact */
:root { --cream: #FAF7F2; --warm: #F2EDE4; --gold: #B8965A; --gold-lt: #D4B07A; --dark: #1C1610; --muted: #8A7A6A; --border: #DDD5C8; }
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cream);color:var(--dark);font-family:'Jost',sans-serif;}
.showcase-section{padding:100px 24px;}
.grid-hero{max-width:1200px;margin:0 auto;display:grid;gap:4px;grid-template-columns:repeat(4, 1fr);}
.img-card{position:relative;overflow:hidden;cursor:pointer;height:240px;background:var(--border);}
.img-placeholder{width:100%;height:100%;background-size:cover;background-position:center;transition:transform 0.8s ease;}
.img-card:hover .img-placeholder{transform:scale(1.1);}
</style>
</head>
<body>

<section class="showcase-section" id="reception">
  <div class="grid-hero" style="grid-template-columns: repeat(5, 1fr);">
    <script>for(let i=1; i<=10; i++) document.write(`<div class="img-card"><div class="img-placeholder" style="background-image:url('../images/reception/reception-${i}.jpg')"></div></div>`);</script>
  </div>
</section>

<section class="showcase-section" id="ceremony">
  <div class="grid-hero" style="grid-template-columns: repeat(4, 1fr);">
    <script>for(let i=1; i<=8; i++) document.write(`<div class="img-card"><div class="img-placeholder" style="background-image:url('../images/ceremony/ceremony-${i}.jpg')"></div></div>`);</script>
  </div>
</section>

<section class="showcase-section" id="bouquet">
  <div class="grid-hero" style="grid-template-columns: repeat(3, 1fr);">
    <script>for(let i=1; i<=9; i++) document.write(`<div class="img-card"><div class="img-placeholder" style="background-image:url('../images/bouquet/bouquet-${i}.jpg')"></div></div>`);</script>
  </div>
</section>

<section class="showcase-section" id="debut">
  <div class="grid-hero" style="grid-template-columns: repeat(4, 1fr);">
    <script>for(let i=1; i<=7; i++) document.write(`<div class="img-card"><div class="img-placeholder" style="background-image:url('images/debut-${i}.jpg')"></div></div>`);</script>
  </div>
</section>

<section class="showcase-section" id="birthday">
  <div class="grid-hero" style="grid-template-columns: repeat(4, 1fr);">
    <script>for(let i=1; i<=7; i++) document.write(`<div class="img-card"><div class="img-placeholder" style="background-image:url('images/bday-${i}.jpg')"></div></div>`);</script>
  </div>
</section>

</body>
</html>
